name: Build and publish package

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/validate-release-version.test.mjs
      - run: node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"

  build-agent:
    name: Build canonical Agent and registered installer
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
      - name: Build Agent once and wrap registered installer
        env:
          ONCLAW_TDX_THS_RELEASE_UNSIGNED: "1"
        run: npm run release:agent
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-agent-release
          path: |
            release/agent/onclaw-tdx-ths-agent.exe
            release/agent/onclaw-tdx-ths-setup-win-x64.exe
            release/agent/SHA256SUMS.txt
          if-no-files-found: error

  build-npm:
    name: Build npm package with canonical Agent
    needs: [validate-release, build-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: canonical-agent-release
          path: release-input
      - name: Inject canonical bare Agent
        run: |
          mkdir -p packages/client/agent/win-x64
          cp release-input/onclaw-tdx-ths-agent.exe packages/client/agent/win-x64/
          cp release-input/SHA256SUMS.txt packages/client/agent/win-x64/
      - name: Build and test HTTP client
        run: |
          npm run test:client
          npm run test:examples
      - name: Pack exact npm artifact
        run: |
          mkdir -p dist/npm
          npm pack --workspace tdx-ths-linker --pack-destination dist/npm
          npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/npm/*.tgz
          if-no-files-found: error

  build-python:
    name: Build PyPI HTTP client with canonical Agent
    needs: [validate-release, build-agent]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-agent-release
          path: release-input
      - name: Inject canonical bare Agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force python/src/tdx_ths_linker/agent/win-x64 | Out-Null
          Copy-Item release-input/onclaw-tdx-ths-agent.exe python/src/tdx_ths_linker/agent/win-x64/
          Copy-Item release-input/SHA256SUMS.txt python/src/tdx_ths_linker/agent/win-x64/
      - name: Test and build Python HTTP client
        shell: pwsh
        run: |
          python -m pip install --upgrade build pytest twine
          $env:PYTHONPATH = "python/src"
          python -m pytest python/tests
          python -m build --wheel
          python -m twine check dist/*.whl
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python scripts/validate-python-wheel.py $wheel.FullName release-input/onclaw-tdx-ths-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*.whl
          if-no-files-found: error

  publish-npm:
    name: Publish npm package
    needs: build-npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist/npm
      - name: Publish exact tested npm package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "tdx-ths-linker@$version" version >/dev/null 2>&1; then
            echo "tdx-ths-linker@$version already exists; continuing partial release recovery"
          else
            npm publish dist/npm/*.tgz --access public --tag latest
          fi

  publish-pypi:
    name: Publish PyPI package
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-cloud:
    name: Deploy registered Web installer and example
    needs: [build-agent, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: canonical-agent-release
          path: release-assets
      - name: Create or update Web download release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          rm release-assets/onclaw-tdx-ths-agent.exe
          sha256sum release-assets/onclaw-tdx-ths-setup-win-x64.exe > release-assets/SHA256SUMS.txt
          cp examples/web-quickstart/index.html release-assets/onclaw-tdx-ths-web-example.html
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
