name: Build and publish packages

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_VERSION: ${{ vars.ONCLAW_TDX_THS_ELECTRON_VERSION || '39.2.0' }}

jobs:
  validate-release:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test release version validation
        run: node --test scripts/validate-release-version.test.mjs
      - name: Match tag to every package version
        run: node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"

  build-node:
    name: Build .node package
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Electron Node-API module
        shell: pwsh
        env:
          ONCLAW_TDX_THS_ELECTRON_VERSION: ${{ env.ELECTRON_VERSION }}
        run: npm run build:native
      - name: Package .node module
        shell: pwsh
        run: |
          $stage = "dist/node-package"
          $archive = "dist/tdx-ths-linker-node-electron-$env:ELECTRON_VERSION-win-x64.zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/native/win-x64/tdx-ths-linker.node" $stage
          $hash = (Get-FileHash "$stage/tdx-ths-linker.node" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  tdx-ths-linker.node" | Set-Content "$stage/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
      - uses: actions/upload-artifact@v4
        with:
          name: node-release
          path: dist/tdx-ths-linker-node-*.zip
          if-no-files-found: error

  build-npm:
    name: Build npm package
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test client
        run: npm run test:client
      - name: Pack exact npm artifact
        run: |
          mkdir -p dist/npm
          npm pack --workspace tdx-ths-linker --pack-destination dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/npm/*.tgz
          if-no-files-found: error

  build-python:
    name: Build PyPI wheel
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build pytest twine "packaging>=24.2"
      - name: Run Python unit tests
        env:
          PYTHONPATH: python/src
        run: python -m pytest python/tests
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Validate wheel contents and clean install
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python scripts/validate-python-wheel.py $wheel.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-agent:
    name: Build portable Agent and installer
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
      - name: Build Agent and installer
        env:
          ONCLAW_TDX_THS_RELEASE_UNSIGNED: "1"
        run: npm run release:agent
      - name: Validate installer registration lifecycle
        shell: pwsh
        run: >-
          ./scripts/validate-agent-installer.ps1
          ./release/agent/onclaw-tdx-ths-setup-win-x64.exe
      - name: Package portable Agent
        shell: pwsh
        run: |
          $stage = "dist/agent-portable"
          $archive = "dist/onclaw-tdx-ths-agent-portable-win-x64.zip"
          $assets = "dist/agent-release-assets"
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force $assets | Out-Null
          Copy-Item "release/agent/onclaw-tdx-ths-agent.exe" $stage
          Copy-Item "release/agent/SHA256SUMS.txt" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          Copy-Item $archive $assets
          Copy-Item "release/agent/onclaw-tdx-ths-setup-win-x64.exe" $assets
          Copy-Item "release/agent/SHA256SUMS.txt" $assets
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: dist/agent-release-assets/*
          if-no-files-found: error

  build-skill:
    name: Build Codex Skill package
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and package Skill
        run: python scripts/package-skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-release
          path: dist/skills/tdx-ths-linker-skill-*.zip
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI package
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish npm package
    needs: build-npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist/npm
      - name: Publish exact tested npm package
        run: npm publish dist/npm/*.tgz --access public --tag latest

  publish-github:
    name: Publish .node, Agent, installer, and Skill packages
    needs: [build-node, build-agent, build-skill, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: skill-release
          path: release-assets
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
