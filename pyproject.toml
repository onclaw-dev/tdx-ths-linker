[build-system]
requires = ["scikit-build-core>=0.10,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "tdx-ths-linker"
version = "0.1.0"
description = "Native Windows Python integration for TDX and THS"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "onclaw-tdx-ths contributors" }]
keywords = ["tdx", "ths", "windows", "stock"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/onclaw-dev/tdx-ths-linker"
Documentation = "https://github.com/onclaw-dev/tdx-ths-linker/tree/main/docs"
Source = "https://github.com/onclaw-dev/tdx-ths-linker"
Issues = "https://github.com/onclaw-dev/tdx-ths-linker/issues"

[project.scripts]
tdx-ths-linker = "tdx_ths_linker.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/src/tdx_ths_linker"]
wheel.py-api = "py3"
wheel.platlib = true
cmake.build-type = "Release"
sdist.include = [
  "native/core/**",
  "native/c-api/**",
  "python/src/**",
  "python/tests/**",
  "CMakeLists.txt",
  "README.md",
  "LICENSE",
]

[tool.scikit-build.cmake.define]
ONCLAW_BUILD_CAPI = "ON"
ONCLAW_BUILD_NODE = "OFF"
ONCLAW_BUILD_AGENT = "OFF"
ONCLAW_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
