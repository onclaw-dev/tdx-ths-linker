[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx-ths-linker"
version = "0.1.4"
description = "Python HTTP client with the canonical bare Windows Agent for TDX/THS"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "onclaw-tdx-ths contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]

[project.scripts]
tdx-ths-linker-python = "tdx_ths_linker.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "python/src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
tdx_ths_linker = ["py.typed", "agent/win-x64/*.exe", "agent/win-x64/SHA256SUMS.txt"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
